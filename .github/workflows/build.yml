name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore packages
        run: nuget restore Switcheroo.sln

      - name: Install NUnit console runner
        run: nuget install NUnit.ConsoleRunner -Version 3.17.0 -OutputDirectory packages -NonInteractive

      - name: Build (Debug)
        run: msbuild Switcheroo.sln /p:Configuration=Debug /p:UseSharedCompilation=false /v:m /nologo

      - name: Unit tests
        shell: cmd
        run: packages\NUnit.ConsoleRunner.3.17.0\tools\nunit3-console.exe Core.UnitTests\bin\Debug\Switcheroo.Core.UnitTests.dll --result=TestResult.xml

      - name: Watchdog acceptance tests
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File AutomationTests/Run-All.ps1 -SkipBuild -SkipDesktop

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResult.xml
            .temp/acceptance/**/results.json
            .temp/acceptance/**/unit-tests.xml
            .temp/acceptance/**/watchdog.log
            .temp/acceptance/**/report.json
            .temp/acceptance/**/debugger.txt
            .temp/acceptance/**/*.png
          if-no-files-found: ignore
